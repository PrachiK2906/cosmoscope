<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cosmoscope</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* VOICE immersive and quiet, a night-sky instrument rather than a game
   IDEA a planetarium console: the sky fills everything, instruments sit at the edges
   PICTURE the live 3D universe, full bleed, from Earth's orbit out to the cosmic microwave background
   COLOUR deep space #04060b, starlight ink #e8ecf4, sky blue #8ab8ff for interface, warm star #ffc777 for what is selected
   TYPE Space Grotesk for names and numbers, Inter for reading
   LAYOUT canvas full bleed; search and tours across the top; scale ladder down the left; info sheet on the right; clock along the bottom. Phone: ladder becomes a strip, info a bottom sheet */
:root{color-scheme:dark;--bg:#04060b;--ink:#e8ecf4;--dim:#9aa6bb;--line:rgba(160,180,220,.18);--glass:rgba(10,14,24,.78);--blue:#8ab8ff;--warm:#ffc777}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;left:0;top:0;white-space:nowrap;font:500 13px/1 Inter,sans-serif;color:var(--ink);padding:4px 7px 4px 14px;pointer-events:auto;cursor:pointer;text-shadow:0 0 4px #000,0 0 8px #000;opacity:.88;transition:opacity .2s}
.lab::before{content:"";position:absolute;left:2px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--c,#fff);box-shadow:0 0 6px var(--c,#fff)}
.lab:hover,.lab.sel{opacity:1;color:#fff}
.lab.sel{font-weight:600;color:var(--warm)}
.lab.off{visibility:hidden}
.panel{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px}
#top{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:10px;align-items:center;pointer-events:none}
#top>*{pointer-events:auto}
#brand{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 10px;height:46px}
#brand svg{width:26px;height:26px;flex:none}
#brand b{font:700 19px/1 'Space Grotesk',sans-serif;letter-spacing:-.01em}
#sbox{position:relative;flex:1;max-width:460px;margin-inline:auto}
#q{width:100%;height:46px;padding:0 14px 0 42px;font-size:16px;background:var(--glass);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#q::placeholder{color:var(--dim)}
#sbox svg{position:absolute;left:14px;top:14px;width:18px;height:18px;opacity:.7;pointer-events:none}
#res{position:absolute;top:52px;left:0;right:0;padding:6px;display:none;max-height:60vh;overflow:auto}
#res.on{display:block}
#res button{display:flex;width:100%;justify-content:space-between;gap:12px;align-items:center;padding:10px 12px;border-radius:9px;text-align:left;min-height:44px}
#res button:hover,#res button.act{background:rgba(138,184,255,.14)}
#res small{color:var(--dim);font-size:13px;white-space:nowrap}
.tbtn{height:46px;padding:0 16px;display:flex;align-items:center;gap:8px;font-weight:600}
.tbtn:hover{border-color:rgba(138,184,255,.5)}
#menu{position:fixed;top:66px;right:12px;width:330px;max-width:calc(100vw - 24px);max-height:calc(100% - 80px);overflow:auto;padding:8px;display:none;z-index:5}
#menu.on{display:block}
#menu h3{font:600 13px/1 Inter;color:var(--dim);margin:10px 10px 8px}
#menu button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:9px;min-height:44px}
#menu button:hover{background:rgba(138,184,255,.14)}
#menu button span{display:block;color:var(--dim);font-size:13px}
#menu .chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 8px 10px}
#menu .chip{display:inline-flex;align-items:center;gap:7px;width:auto;padding:8px 11px;min-height:36px;border:1px solid var(--line);border-radius:99px;font-size:13px}
#menu .chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
#menu .chip[aria-pressed=false]{opacity:.4}
#ladder{position:fixed;left:12px;top:50%;transform:translateY(-50%);padding:8px;width:212px}
#ladder ol{list-style:none;margin:0;padding:0;position:relative}
#ladder ol::before{content:"";position:absolute;left:17px;top:18px;bottom:18px;width:1px;background:var(--line)}
#ladder button{display:flex;gap:12px;align-items:center;width:100%;padding:8px 8px;border-radius:9px;text-align:left;min-height:46px;position:relative}
#ladder button:hover{background:rgba(138,184,255,.1)}
#ladder i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--dim);background:var(--bg);flex:none;margin-left:4px}
#ladder b{display:block;font:600 14px/1.2 'Space Grotesk',sans-serif}
#ladder small{display:block;color:var(--dim);font-size:13px;line-height:1.3}
#ladder .on i{background:var(--warm);border-color:var(--warm);box-shadow:0 0 10px var(--warm)}
#ladder .on b{color:var(--warm)}
#note{margin:6px 8px 4px;padding-top:8px;border-top:1px solid var(--line);color:var(--dim);font-size:13px;line-height:1.4}
#side{position:fixed;right:12px;top:70px;bottom:84px;width:360px;display:flex;flex-direction:column;transform:translateX(calc(100% + 24px));transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#side.on{transform:none}
#pbody{overflow:auto;padding:18px 18px 16px}
#pclose{position:absolute;right:8px;top:8px;width:40px;height:40px;border-radius:10px;font-size:22px;line-height:1;color:var(--dim)}
#pclose:hover{color:#fff;background:rgba(255,255,255,.08)}
.cat{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--dim)}
.cat i{width:8px;height:8px;border-radius:50%;background:var(--c)}
#pbody h2{font:700 32px/1.05 'Space Grotesk',sans-serif;letter-spacing:-.02em;margin:8px 40px 4px 0;text-wrap:balance}
#pbody .type{color:var(--dim);margin:0 0 14px}
.dist{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px}
.dist div{background:rgba(6,9,16,.9);padding:10px 12px}
.dist small{display:block;color:var(--dim);font-size:13px}
.dist b{font:600 17px/1.25 'Space Grotesk',sans-serif;font-variant-numeric:tabular-nums}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 14px;font-size:14px}
dt{color:var(--dim)}
dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
#pbody p{font-size:15.5px;margin:0 0 12px}
.fact{border-left:2px solid var(--warm);padding:2px 0 2px 12px;color:#f3e6cf}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{min-height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:rgba(138,184,255,.1);font-weight:600;font-size:14px}
.btn:hover{background:rgba(138,184,255,.2)}
.btn.pri{background:var(--warm);color:#1b1306;border-color:var(--warm)}
#clock{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:5px 6px 5px 14px;white-space:nowrap}
#clock .d{font:600 15px/1.1 'Space Grotesk',sans-serif;font-variant-numeric:tabular-nums;margin-right:8px}
#clock .d small{display:block;font:500 13px/1.2 Inter;color:var(--dim)}
#clock button{width:40px;height:40px;border-radius:9px;display:grid;place-items:center}
#clock button:hover{background:rgba(255,255,255,.08)}
#clock button svg{width:18px;height:18px}
#clock .now{width:auto;padding:0 10px;font-size:13px;font-weight:600;color:var(--blue)}
#edge{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);padding:6px 6px 6px 16px;display:none;align-items:center;gap:12px;font-size:14px}
#edge.on{display:flex}
#tour{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);width:min(560px,calc(100vw - 24px));padding:16px 18px;display:none}
#tour.on{display:block}
#tour small{color:var(--warm);font-size:13px;font-weight:600}
#tour h4{font:700 22px/1.15 'Space Grotesk',sans-serif;margin:4px 0 6px}
#tour p{margin:0 0 12px;font-size:15.5px}
#tour .acts{margin:0;justify-content:flex-end}
#hint{position:fixed;left:12px;bottom:12px;color:var(--dim);font-size:13px;padding:8px 12px}
#warp{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.35),rgba(138,184,255,.18) 18%,#04060b 62%)}
#warp.on{opacity:1}
#load{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:20;transition:opacity .6s}
#load div{text-align:center}
#load b{display:block;font:700 40px/1 'Space Grotesk',sans-serif;letter-spacing:-.02em;margin-bottom:10px}
#load span{color:var(--dim)}
#load.done{opacity:0;pointer-events:none}
@media (max-width:900px){
 #ladder{top:66px;left:12px;right:12px;transform:none;width:auto;padding:4px}
 #ladder ol{display:flex;overflow-x:auto;gap:2px;scrollbar-width:none}
 #ladder ol::before,#note,#ladder small{display:none}
 #ladder li{flex:none}
 #ladder button{min-height:40px;padding:6px 10px;gap:8px}
 #ladder i{margin:0}
 #side{top:auto;left:12px;right:12px;bottom:78px;width:auto;max-height:46%;transform:translateY(calc(100% + 100px))}
 #side.on{transform:none}
 #hint{display:none}
 #brand b{display:none}
 #brand{padding:8px 10px}
 .tbtn span{display:none}
 #edge,#tour{bottom:78px}
}
@media (max-width:480px){#clock .d small{display:none}#clock button{width:36px}}
@media (prefers-reduced-motion:reduce){#side,#warp{transition:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="Interactive 3D map of the universe"></canvas>
<div id="labels"></div>
<div id="warp"></div>

<header id="top">
 <div id="brand" class="panel"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="5" fill="#ffc777"/><ellipse cx="16" cy="16" rx="14" ry="6" fill="none" stroke="#8ab8ff" stroke-width="1.6" transform="rotate(-24 16 16)"/><circle cx="28" cy="11" r="2" fill="#e8ecf4"/></svg><b>Cosmoscope</b></div>
 <div id="sbox"><svg viewBox="0 0 24 24" fill="none" stroke="#e8ecf4" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" type="search" autocomplete="off" placeholder="Search planets, stars, galaxies…" aria-label="Search the universe"><div id="res" class="panel" role="listbox"></div></div>
 <button id="mbtn" class="panel tbtn" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Tours &amp; layers</span></button>
</header>
<div id="menu" class="panel"></div>

<nav id="ladder" class="panel" aria-label="Scale"><ol></ol><div id="note"></div></nav>

<aside id="side" class="panel" aria-live="polite"><button id="pclose" aria-label="Close">×</button><div id="pbody"></div></aside>

<div id="clock" class="panel">
 <div class="d" id="date"></div>
 <button id="slow" aria-label="Slower"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 6v12l-8-6zM20 6v12l-8-6z"/></svg></button>
 <button id="play" aria-label="Pause"></button>
 <button id="fast" aria-label="Faster"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6v12l8-6zM13 6v12l8-6z"/></svg></button>
 <button id="now" class="now">Now</button>
</div>
<div id="edge" class="panel"><span id="edgeT"></span><button id="edgeB" class="btn pri"></button></div>
<div id="tour" class="panel"><small id="tStep"></small><h4 id="tTitle"></h4><p id="tText"></p><div class="acts"><button class="btn" id="tExit">Exit tour</button><button class="btn" id="tPrev">Back</button><button class="btn pri" id="tNext">Next</button></div></div>
<div id="hint" class="panel">Drag to orbit · scroll to zoom · click anything</div>
<div id="load"><div><b>Cosmoscope</b><span id="loadT">Charting the cosmos…</span></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(()=>{
if(!window.THREE){document.getElementById('loadT').textContent='3D engine failed to load. Please reload the page.';return}
const $=s=>document.querySelector(s);
const V3=THREE.Vector3;
const D2R=Math.PI/180,AUKM=149597870.7,LYKM=9.4607304725808e12,CKMS=299792.458,OBL=23.4392911*D2R,J2000=2451545;
let seed=20261118;
const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
const gauss=()=>{let u=0;while(!u)u=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*rnd())};
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const fmt=(n,d=0)=>n.toLocaleString('en-US',{maximumFractionDigits:d,minimumFractionDigits:0});
const radec=(h,d)=>{const a=h*15*D2R,b=d*D2R;return[Math.cos(b)*Math.cos(a),Math.cos(b)*Math.sin(a),Math.sin(b)]};
const eq2ecl=v=>[v[0],v[1]*Math.cos(OBL)+v[2]*Math.sin(OBL),-v[1]*Math.sin(OBL)+v[2]*Math.cos(OBL)];
const GM=[[-0.0548755604,-0.8734370902,-0.4838350155],[0.4941094279,-0.4448296300,0.7469822445],[-0.8676661490,-0.1980763734,0.4559837762]];
const eq2gal=v=>GM.map(r=>r[0]*v[0]+r[1]*v[1]+r[2]*v[2]);
const gal2eq=g=>[0,1,2].map(j=>GM[0][j]*g[0]+GM[1][j]*g[1]+GM[2][j]*g[2]);
const T3=(v,s=1)=>new V3(v[0]*s,v[2]*s,-v[1]*s);
const jdOf=(y,m,d)=>Date.UTC(y,m-1,d)/864e5+2440587.5;
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];

/* ---------- noise ---------- */
const PERM=new Uint8Array(256);{const p=[...Array(256).keys()];for(let i=255;i>0;i--){const j=Math.floor(rnd()*(i+1));[p[i],p[j]]=[p[j],p[i]]}p.forEach((v,i)=>PERM[i]=v)}
const H=(x,y,z)=>PERM[(PERM[(PERM[x&255]+y)&255]+z)&255]/255;
const sm=t=>t*t*(3-2*t);
function vn(x,y,z){const X=Math.floor(x),Y=Math.floor(y),Z=Math.floor(z),u=sm(x-X),v=sm(y-Y),w=sm(z-Z);const l=(a,b,t)=>a+(b-a)*t;
 return l(l(l(H(X,Y,Z),H(X+1,Y,Z),u),l(H(X,Y+1,Z),H(X+1,Y+1,Z),u),v),l(l(H(X,Y,Z+1),H(X+1,Y,Z+1),u),l(H(X,Y+1,Z+1),H(X+1,Y+1,Z+1),u),v),w)}
function fbm(x,y,z,o=5){let s=0,a=1,n=0;for(let i=0;i<o;i++){s+=a*vn(x,y,z);n+=a;a*=.5;x*=2.03;y*=2.03;z*=2.03}return s/n}

/* ---------- textures ---------- */
const cv=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const TX=c=>{const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t};
function sphereTex(w,h,fn){const c=cv(w,h),g=c.getContext('2d'),im=g.createImageData(w,h),d=im.data;
 for(let j=0;j<h;j++){const lat=(.5-(j+.5)/h)*Math.PI,cl=Math.cos(lat),sl=Math.sin(lat);
  for(let i=0;i<w;i++){const lon=(i+.5)/w*2*Math.PI,col=fn(cl*Math.cos(lon),sl,cl*Math.sin(lon),lat,lon),k=(j*w+i)*4;d[k]=col[0];d[k+1]=col[1];d[k+2]=col[2];d[k+3]=255}}
 g.putImageData(im,0,0);return c}
function craters(c,n,dark=.28){const g=c.getContext('2d');for(let i=0;i<n;i++){const x=rnd()*c.width,y=c.height*(.12+.76*rnd()),r=(rnd()**3)*c.width*.03+1;g.beginPath();g.arc(x,y,r,0,7);g.fillStyle=`rgba(0,0,0,${dark*rnd()})`;g.fill();g.strokeStyle=`rgba(255,255,255,${.18*rnd()})`;g.lineWidth=Math.max(1,r*.18);g.stroke()}return c}
const rock=(a,b,f=3)=>{const A=hex(a),B=hex(b);return(x,y,z)=>{const n=fbm(x*f+9,y*f,z*f,5),m=fbm(x*f*5,y*f*5,z*f*5,3);return mix(B,A,clamp(n*1.5-.25+(m-.5)*.35))}};
const bands=(cols,freq,turb,spot)=>{const C=cols.map(hex);return(x,y,z,lat,lon)=>{const n=fbm(x*2.5+3,y*2.5,z*2.5,4);let t=(lat/Math.PI+.5)*freq+(n-.5)*turb;t=((t%C.length)+C.length)%C.length;const i=Math.floor(t);let c=mix(C[i],C[(i+1)%C.length],sm(t-i));
 if(spot){const dl=(lat-spot[0]*D2R)/(spot[2]*D2R);let dn=lon-spot[1];dn=Math.atan2(Math.sin(dn),Math.cos(dn))/(spot[3]*D2R);const r=dl*dl+dn*dn;if(r<1)c=mix(c,hex(spot[4]),(1-r)*.85)}return c}};
const RECIPE={
 mercury:()=>craters(sphereTex(512,256,rock('#b0a79c','#5d5650')),260),
 moon:()=>craters(sphereTex(512,256,rock('#c4c4c2','#6a6a68',2.2)),220,.35),
 venus:()=>sphereTex(512,256,bands(['#e8c98e','#d2a865','#f0dcb0','#c99a55'],4,2.4)),
 earth:()=>sphereTex(512,256,(x,y,z,lat)=>{const n=fbm(x*1.9+3,y*1.9,z*1.9,6),cl=fbm(x*3+20,y*5,z*3,5),al=Math.abs(lat)/D2R;let c;
  if(n>.53){const dry=fbm(x*4+40,y*4,z*4,3);c=mix(hex(al<32&&dry>.5?'#b89c66':'#3f6c34'),hex('#7a6c58'),clamp((n-.6)*4));}else c=mix(hex('#0a2552'),hex('#1f6aa8'),clamp((n-.38)*6));
  if(al>70||(n>.5&&al>62))c=hex('#eef3f7');if(cl>.56)c=mix(c,[255,255,255],clamp((cl-.56)*3.2));return c}),
 mars:()=>craters(sphereTex(512,256,(x,y,z,lat)=>{const n=fbm(x*2.5,y*2.5,z*2.5,6),d=fbm(x*1.2+7,y*1.2,z*1.2,3);let c=mix(hex('#7b3218'),hex('#c86a3a'),clamp(n*1.6-.3));if(d>.58)c=mix(c,hex('#4a2618'),.5);if(Math.abs(lat)>78*D2R)c=hex('#f2ece4');return c}),80,.2),
 jupiter:()=>sphereTex(512,256,bands(['#e9d8bd','#c28b5c','#f3e8d6','#a9714d','#dcb98f','#efe3cc'],15,1.3,[-22,1.2,6,11,'#c0603a'])),
 saturn:()=>sphereTex(512,256,bands(['#ead7a8','#d0b67f','#f3e7c4','#c2a670'],9,.7)),
 uranus:()=>sphereTex(256,128,bands(['#b8e8ee','#a6dde6','#c6f0f2'],5,.25)),
 neptune:()=>sphereTex(256,128,bands(['#3e64d8','#2f50c0','#5079e6'],7,.9,[-20,2,7,12,'#1d2f80'])),
 pluto:()=>sphereTex(256,128,(x,y,z,lat,lon)=>{const n=fbm(x*3,y*3,z*3,5);let c=mix(hex('#6b4a33'),hex('#d4b993'),clamp(n*1.6-.3));const dl=(lat-15*D2R)/(22*D2R);let dn=Math.atan2(Math.sin(lon-3.6),Math.cos(lon-3.6))/(26*D2R);if(dl*dl+dn*dn<1)c=hex('#f2ebdf');return c}),
 io:()=>sphereTex(256,128,(x,y,z)=>{const n=fbm(x*3,y*3,z*3,5),s=vn(x*9,y*9,z*9);let c=mix(hex('#c99c35'),hex('#f0dc6a'),n);if(s>.8)c=hex('#4a2c14');return c}),
 europa:()=>sphereTex(256,128,(x,y,z)=>{const n=fbm(x*3,y*3,z*3,4),l=Math.abs(Math.sin(fbm(x*2+5,y*2,z*2,3)*40));let c=mix(hex('#cdbfa6'),hex('#efe7d8'),n);if(l<.08)c=hex('#9b6a46');return c}),
 ganymede:()=>craters(sphereTex(256,128,rock('#ab9e8b','#5a5045')),60),
 callisto:()=>craters(sphereTex(256,128,rock('#7c6f5f','#352c24')),120,.2),
 titan:()=>sphereTex(256,128,bands(['#d99a3c','#c98a32','#e2aa4c'],3,.6)),

/* ---------- formatting & distances ---------- */
function fmtLY(ly){if(ly<10)return fmt(ly,2)+' ly';if(ly<1e6)return fmt(ly,0)+' ly';if(ly<1e9)return fmt(ly/1e6,ly<1e7?2:1)+' million ly';return fmt(ly/1e9,1)+' billion ly'}
function fmtYears(y){return y<1e6?fmt(y,y<10?2:0)+' years':y<1e9?fmt(y/1e6,1)+' million years':fmt(y/1e9,1)+' billion years'}
function fmtT(s){if(s<60)return s.toFixed(2)+' s';if(s<3600)return Math.floor(s/60)+' min '+Math.round(s%60)+' s';if(s<172800)return Math.floor(s/3600)+' h '+Math.round(s%3600/60)+' min';const d=s/86400;return d<730?fmt(d,0)+' days':fmtYears(d/365.25)}
function distInfo(o){
 if(o.level===0){let km;if(o===EARTH)return[['Distance from Sun',fmt(Math.hypot(...EARTH.au),3)+' AU'],['Sunlight takes',fmtT(Math.hypot(...EARTH.au)*AUKM/CKMS)]];
  if(o.parent===EARTH&&o.km)km=o.km;else if(o.au&&!o.frame){const a=o.au,e=EARTH.au;km=Math.hypot(a[0]-e[0],a[1]-e[1],a[2]-e[2])*AUKM}
  if(km==null)return null;const au=km/AUKM;return[['Distance from Earth',au<.05?fmt(km,0)+' km':fmt(au,au<10?2:1)+' AU'],['Light from Earth takes',fmtT(km/CKMS)]]}
 if(o.cm!=null){if(!o.cm)return null;return[['Present distance',fmtLY(o.cm*1e9)],['Light we see left',o.lt?fmt(o.lt,1)+' billion years ago':'—']]}

 const mid=Math.sin(Math.PI*e);if(anim.o&&anim.p0.distanceTo(anim.p1)>60){const lift=camera.position.clone().sub(controls.target).normalize();camera.position.addScaledVector(lift,mid*anim.p0.distanceTo(anim.p1)*.12)}
 if(t>=1){const o=anim.o;anim=null;controls.enabled=true;if(o&&o.dyn){follow=o;lastF.copy(o.pos)}}}
function flyTo(o){if(o.level!==cur){goLevel(o.level,'jump',()=>flyTo(o));return}
 const L=LV[cur];follow=null;
 if(o.frame){const c=o.center||new V3();const dir=camera.position.clone().sub(controls.target);if(dir.lengthSq()<1e-6)dir.copy(L.dir);dir.normalize().lerp(L.dir.clone().normalize(),.5).normalize();controls.minDistance=L.min;animateTo(c.clone().add(dir.multiplyScalar(o.view)),c,1800);return}
 const P=o.pos.clone();let dir=camera.position.clone().sub(controls.target);if(dir.lengthSq()<1e-6)dir.set(0,.3,1);dir.normalize();
 if(cur===0&&P.length()>1){const lit=P.clone().negate().normalize();lit.y+=.35;dir.lerp(lit.normalize(),.6).normalize()}
 controls.minDistance=Math.max(.3,(o.vis||.5)*1.4);
 animateTo(P.clone().add(dir.multiplyScalar(o.view||10)),P,1800,o)}
function goLevel(i,mode,cb){if(i<0||i>=LV.length||busy)return;if(i===cur&&mode!=='jump'){cb&&cb();return}
 busy=true;$('#warp').classList.add('on');
 setTimeout(()=>{LV.forEach((L,k)=>L.group.visible=k===i);const from=cur;cur=i;const L=LV[i];anim=null;follow=null;controls.enabled=true;
  controls.maxDistance=L.max;controls.minDistance=L.min;controls.target.set(0,0,0);const dir=L.dir.clone().normalize();
  if(mode==='up'||(mode==='jump'&&i>from)){camera.position.copy(dir.clone().multiplyScalar(L.min*2.5))}else if(mode==='down'||mode==='jump'){camera.position.copy(dir.clone().multiplyScalar(L.max*.92))}
  if(cb){camera.position.copy(dir.clone().multiplyScalar(L.start*(mode==='up'?.25:1)))}
  if(!cb)animateTo(dir.clone().multiplyScalar(L.start),new V3(),1900);
  renderLadder();$('#clock').style.display=i===0?'flex':'none';OBJ.forEach(o=>o.w=0);
  setTimeout(()=>{$('#warp').classList.remove('on');busy=false;cb&&cb()},60)},420)}

/* ---------- panel ---------- */
const pbody=$('#pbody'),side=$('#side');
function chip(o){const c=CATS[o.cat];return`<span class="cat" style="--c:${c[1]}"><i></i>${c[2]}</span>`}
function distHTML(o){const d=distInfo(o);return d?`<div class="dist">${d.map(([k,v])=>`<div><small>${k}</small><b>${v}</b></div>`).join('')}</div>`:''}
function showPanel(o){const i=o.info;
 pbody.innerHTML=`${chip(o)}<h2>${o.name}</h2><p class="type">${i.type}</p><div id="pdist">${distHTML(o)}</div>${i.stats.length?`<dl>${i.stats.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`:''}<p>${i.desc}</p><p class="fact">${i.fact}</p>${o.note?'<p style="color:var(--dim);font-size:13px">Orbit shown is approximate.</p>':''}
 <div class="acts">${o.goLevel!=null?`<button class="btn pri" id="pgo">Zoom into ${LV[o.goLevel].name}</button>`:''}<button class="btn${o.goLevel==null?' pri':''}" id="pfly">Fly here</button>${o.dyn?'<button class="btn" id="pfol">'+(follow===o?'Stop following':'Follow')+'</button>':''}<button class="btn" id="pcopy">Copy link</button></div>`;
 side.classList.add('on');
 $('#pfly').onclick=()=>flyTo(o);
 if($('#pgo'))$('#pgo').onclick=()=>{const t=o.goLevel;goLevel(t,'down')};
 if($('#pfol'))$('#pfol').onclick=e=>{if(follow===o){follow=null;e.target.textContent='Follow'}else{follow=o;lastF.copy(o.pos);e.target.textContent='Stop following'}};
 $('#pcopy').onclick=async e=>{try{await navigator.clipboard.writeText(location.href.split('#')[0]+'#'+o.id);e.target.textContent='Link copied'}catch(_){e.target.textContent='#'+o.id}}}
function select(o,fly=true){sel=o;showPanel(o);if(fly)flyTo(o);try{history.replaceState(null,'','#'+o.id)}catch(_){}}
$('#pclose').onclick=()=>{side.classList.remove('on');sel=null;follow=null;try{history.replaceState(null,'',location.pathname+location.search)}catch(_){}};

/* ---------- ladder ---------- */
function renderLadder(){$('#ladder ol').innerHTML=LV.map((L,i)=>`<li><button data-i="${i}" class="${i===cur?'on':''}" aria-current="${i===cur}"><i></i><span><b>${L.name}</b><small>${L.span}</small></span></button></li>`).join('');$('#note').textContent=LV[cur].note;
 const a=$('#ladder .on');if(a&&innerWidth<=900)a.scrollIntoView({inline:'center',block:'nearest'})}
$('#ladder').addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(!b)return;const i=+b.dataset.i;if(i!==cur){side.classList.remove('on');sel=null;goLevel(i,i>cur?'up':'down')}});

/* ---------- search ---------- */
const q=$('#q'),res=$('#res');let hits=[],act=0;
function doSearch(){const s=q.value.trim().toLowerCase();if(!s){res.classList.remove('on');return}
 hits=OBJ.filter(o=>o.name.toLowerCase().includes(s)||o.id.includes(s.replace(/\s+/g,'-'))).sort((a,b)=>(a.name.toLowerCase().startsWith(s)?0:1)-(b.name.toLowerCase().startsWith(s)?0:1)||a.rank-b.rank).slice(0,8);act=0;
 res.innerHTML=hits.length?hits.map((o,i)=>`<button role="option" data-i="${i}" class="${i===act?'act':''}"><span>${o.name}</span><small>${LV[o.level].name}</small></button>`).join(''):'<div style="padding:12px;color:var(--dim)">Nothing found. Try “Mars”, “Betelgeuse” or “Andromeda”.</div>';res.classList.add('on')}
q.addEventListener('input',doSearch);
q.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();act=(act+(e.key==='ArrowDown'?1:-1)+hits.length)%Math.max(1,hits.length);[...res.querySelectorAll('button')].forEach((b,i)=>b.classList.toggle('act',i===act))}
 else if(e.key==='Enter'&&hits[act]){pick(hits[act])}else if(e.key==='Escape'){q.value='';res.classList.remove('on');q.blur()}});
res.addEventListener('click',e=>{const b=e.target.closest('button');if(b)pick(hits[+b.dataset.i])});
function pick(o){q.value='';res.classList.remove('on');q.blur();endTour();select(o)}
addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus()}if(e.key==='Escape'&&document.activeElement!==q){$('#menu').classList.remove('on')}});

/* ---------- tours & layers menu ---------- */
const TOURS=[
 {name:'Voyager 1: one light-day from home',sub:'6 stops · launch to interstellar space',steps:[['earth','Launch','Voyager 1 left Earth on September 5, 1977, on a mission to Jupiter and Saturn. The dashed line traces its real route.'],['jupiter','Jupiter, March 1979','It swept past Jupiter on March 5, 1979, and discovered active volcanoes on the moon Io: the first seen anywhere beyond Earth.'],['saturn','Saturn, November 1980','At Saturn the team chose a close pass of Titan. That flyby flung Voyager 1 up and out of the plane of the planets for good.'],['heliopause','Leaving the Sun’s bubble','In August 2012, about 121 AU from the Sun, it crossed the heliopause and became the first human-made object in interstellar space.'],['voyager-1','One light-day','On November 18, 2026 it reached one light-day from Earth. A command now takes a full day to arrive, and the reply another day to come back.'],['proxima-centauri','Still nowhere near the stars','Even at about 17 km/s, Voyager 1 would need roughly 75,000 years to travel as far as the nearest star.']]},
 {name:'Powers of ten: Earth to the edge',sub:'10 stops · every scale of the universe',steps:[['earth','Home','One rocky planet, 12,742 km across. Everything else is measured from here.'],['neptune','The planets','Neptune orbits 30 times farther from the Sun than Earth. Sunlight takes about four hours to get there.'],['oort-cloud','The Oort Cloud','A hypothesized shell of icy bodies that may reach 100,000 AU from the Sun, a third of the way to the next star.'],['alpha-centauri','The nearest stars','Alpha Centauri is 4.37 light-years away. At this scale our entire Solar System is a single point.'],['orion-nebula','A stellar nursery','The Orion Nebula, 1,344 light-years away, is the closest large region where new stars are being born.'],['sgr-a','The heart of the galaxy','26,700 light-years away sits Sagittarius A*, a black hole of about 4.3 million Suns.'],['andromeda','The next big galaxy','Andromeda is 2.5 million light-years away. The light reaching your eyes from it left before modern humans existed.'],['virgo-cluster','A city of galaxies','The Virgo Cluster gathers well over a thousand galaxies, about 54 million light-years away.'],['laniakea','Our supercluster','Laniakea is about 520 million light-years across and contains roughly 100,000 galaxies, ours included.'],['cmb','The oldest light','The cosmic microwave background was released 380,000 years after the Big Bang. Nothing visible lies beyond it.']]},
 {name:'Black holes, small to colossal',sub:'5 stops · from 10 to billions of Suns',steps:[['gaia-bh1','The nearest','Gaia BH1, 1,560 light-years away, weighs about 10 Suns and gives off no light at all.'],['cygnus-x1','The first convincing one','Cygnus X-1 eats gas from a companion star and glows in X-rays. It persuaded astronomers black holes are real.'],['sgr-a','Our galaxy’s anchor','Sagittarius A* is about 4.3 million Suns, quiet compared with many others.'],['m87-bh','The first photograph','M87* weighs about 6.5 billion Suns. Its 2019 image was the first picture ever taken of a black hole.'],['ton-618','Among the largest known','TON 618 is estimated at tens of billions of Suns, powering a quasar seen across 10.8 billion years.']]},
 {name:'Rockets that opened space',sub:'7 stops · from Sputnik to Falcon Heavy',steps:[['earth','Sputnik 1, 1957','On October 4, 1957 an R-7 rocket put Sputnik 1, a 58 cm metal ball, into orbit. Its radio beeps started the Space Age.'],['earth','Vostok 1, 1961','On April 12, 1961 Yuri Gagarin became the first human in space, circling Earth once in 108 minutes.'],['apollo-11','Saturn V and Apollo 11, 1969','The Saturn V sent Apollo 11 to the Moon. On July 20, 1969 Armstrong and Aldrin landed at Tranquility Base.'],['hubble','The Space Shuttle, 1981–2011','The Shuttle flew 135 missions. It launched Hubble in April 1990, later serviced it five times, and carried up much of the ISS.'],['iss','Building the ISS','Assembled in orbit from 1998 by rockets from several countries, the station has had people aboard continuously since November 2000.'],['tesla-roadster','Falcon Heavy, 2018','Reusable rockets changed the economics of spaceflight. Falcon Heavy’s first flight sent a Tesla Roadster into orbit around the Sun.'],['moon','Back to the Moon','NASA’s SLS rocket launched the uncrewed Artemis I mission around the Moon in November 2022, the start of a new era of lunar flights.']]},
 {name:'Telescopes that rewrote the sky',sub:'7 stops · Hubble, Webb, Kepler, Gaia',steps:[['hubble','Hubble','Above the blur of the atmosphere, Hubble has been taking sharp pictures of the universe since 1990.'],['hudf','The Ultra Deep Field','Hubble stared at a tiny, seemingly empty patch of sky and found about 10,000 galaxies.'],['jwst','James Webb','Webb sees in infrared from 1.5 million km away, where its sunshield keeps it colder than −223 °C.'],['eagle-nebula','Pillars of Creation','Webb’s 2022 infrared view of the Pillars revealed newborn stars hidden inside the dust.'],['jades-gs-z14-0','The earliest galaxies','Webb confirmed galaxies shining less than 300 million years after the Big Bang.'],['kepler-186','Kepler','The Kepler space telescope (2009–2018) found more than 2,600 confirmed planets by watching stars dim as planets crossed them.'],['gaia-bh3','Gaia','Gaia measured the positions and motions of almost two billion stars, and spotted hidden black holes like Gaia BH3 from the wobble of their companions.']]},
 {name:'Robots on other worlds',sub:'8 stops · landers, orbiters and flybys',steps:[['curiosity','Curiosity','Since 2012 this car-sized rover has been climbing Mount Sharp, reading Mars’s history layer by layer.'],['perseverance','Perseverance and Ingenuity','Perseverance is caching rock samples. Its helicopter, Ingenuity, made the first powered flight on another planet.'],['jupiter','Juno at Jupiter','Juno arrived in July 2016 and has been swooping low over Jupiter’s poles, peering beneath the clouds.'],['saturn','Cassini at Saturn','Cassini explored Saturn for 13 years, then dived into the planet on purpose on September 15, 2017, so it could never contaminate its moons.'],['titan','Huygens on Titan','Carried by Cassini, the Huygens probe landed on Titan in January 2005: the most distant landing ever.'],['ceres','Dawn','Dawn orbited the asteroid Vesta and then the dwarf planet Ceres, the first spacecraft to orbit two different worlds beyond Earth.'],['bennu','OSIRIS-REx','It touched asteroid Bennu in 2020, grabbed a sample and dropped it back to Earth in September 2023.'],['parker','Parker Solar Probe','The closest any spacecraft has come to the Sun: 6.1 million km from its surface in December 2024.']]},
 {name:'The great escape',sub:'5 stops · the probes leaving the Solar System',steps:[['pioneer-10','Pioneer 10','The first spacecraft to cross the asteroid belt and visit Jupiter. Its last faint signal arrived in January 2003.'],['pioneer-11','Pioneer 11','The first to visit Saturn, in 1979. Contact was lost in 1995 as its power faded.'],['voyager-2','Voyager 2','The only visitor to Uranus and Neptune. It entered interstellar space in November 2018.'],['new-horizons','New Horizons','After Pluto and Arrokoth, it is still exploring the Kuiper Belt on its way out of the Solar System.'],['voyager-1','Voyager 1','The farthest human-made object of all, now a full light-day from home and still sending data.']]},
 {name:'Where could life exist?',sub:'7 stops · ocean moons and distant Earths',steps:[['mars','Mars','Once warm and wet, Mars is where rovers search for signs of ancient microbial life.'],['europa','Europa','A global ocean under the ice, with more water than all of Earth’s oceans combined.'],['enceladus','Enceladus','Geysers spray its hidden ocean into space, laced with salts and organic molecules.'],['titan','Titan','Lakes of methane, a thick atmosphere and complex organic chemistry make it a natural laboratory.'],['proxima-b','Proxima b','The nearest exoplanet sits in its star’s habitable zone, just 4.24 light-years away.'],['trappist-1','TRAPPIST-1','Seven Earth-sized planets, several where water could be liquid. JWST is studying their atmospheres.'],['kepler-452','Kepler-452b','A larger cousin of Earth around a Sun-like star, 1,800 light-years away.']]}];
function renderMenu(){$('#menu').innerHTML=`<h3>Guided tours</h3>${TOURS.map((t,i)=>`<button data-t="${i}">${t.name}<span>${t.sub}</span></button>`).join('')}<h3>Show</h3><div class="chips">${Object.entries(CATS).filter(([k])=>k!=='home').map(([k,[n,c]])=>`<button class="chip" data-f="${k}" aria-pressed="${filt[k]}" style="--c:${c}"><i></i>${n}</button>`).join('')}<button class="chip" data-f="orbits" aria-pressed="${filt.orbits}" style="--c:#8ecbff"><i></i>Orbits & paths</button><button class="chip" data-f="labels" aria-pressed="${filt.labels}" style="--c:#fff"><i></i>Labels</button></div>`}
$('#mbtn').onclick=e=>{e.stopPropagation();const m=$('#menu');renderMenu();m.classList.toggle('on');$('#mbtn').setAttribute('aria-expanded',m.classList.contains('on'))};
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#menu,#mbtn'))$('#menu').classList.remove('on');if(!e.target.closest('#sbox'))res.classList.remove('on')});
$('#menu').addEventListener('click',e=>{const t=e.target.closest('[data-t]'),f=e.target.closest('[data-f]');if(t){$('#menu').classList.remove('on');startTour(TOURS[+t.dataset.t])}
 if(f){const k=f.dataset.f;filt[k]=!filt[k];f.setAttribute('aria-pressed',filt[k]);applyFilters()}});
function applyFilters(){OBJ.forEach(o=>{if(o.node&&o!==SUN)o.node.visible=filt[o.cat];(o.extra||[]).forEach(x=>x.visible=filt.orbits&&filt[o.cat]);if(o.orbitLine)o.orbitLine.visible=filt.orbits&&filt.moon});
 S0.children.forEach(c=>{if(c.isLine&&!OBJ.some(o=>(o.extra||[]).includes(c)))c.visible=filt.orbits})}
let tour=null;
function startTour(t){tour={t,i:0};$('#tour').classList.add('on');$('#edge').classList.remove('on');showStep()}
function showStep(){const{t,i}=tour,[id,title,text]=t.steps[i];$('#tStep').textContent=`${t.name} · ${i+1} of ${t.steps.length}`;$('#tTitle').textContent=title;$('#tText').textContent=text;$('#tPrev').disabled=i===0;$('#tPrev').style.opacity=i===0?.4:1;$('#tNext').textContent=i===t.steps.length-1?'Finish':'Next';sel=byId[id];side.classList.remove('on');flyTo(byId[id])}
function endTour(){tour=null;$('#tour').classList.remove('on')}
$('#tNext').onclick=()=>{if(tour.i<tour.t.steps.length-1){tour.i++;showStep()}else{const o=byId[tour.t.steps[tour.i][0]];endTour();select(o,false)}};
$('#tPrev').onclick=()=>{if(tour.i>0){tour.i--;showStep()}};
$('#tExit').onclick=endTour;

/* ---------- time ---------- */
const SPEEDS=[[-31557600,'−1 year / s'],[-2629800,'−1 month / s'],[-86400,'−1 day / s'],[1,'real time'],[3600,'1 hour / s'],[86400,'1 day / s'],[604800,'1 week / s'],[2629800,'1 month / s'],[31557600,'1 year / s']];
let simMs=Date.now(),spd=4,playing=true;
const PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg>',PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
function renderClock(){const d=new Date(simMs);$('#date').innerHTML=`${d.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric',timeZone:'UTC'})} <small>${d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',timeZone:'UTC',hour12:false})} UTC · ${playing?SPEEDS[spd][1]:'paused'}</small>`;$('#play').innerHTML=playing?PAUSE:PLAY;$('#play').setAttribute('aria-label',playing?'Pause':'Play')}
$('#play').onclick=()=>{playing=!playing;renderClock()};$('#slow').onclick=()=>{spd=Math.max(0,spd-1);playing=true;renderClock()};$('#fast').onclick=()=>{spd=Math.min(SPEEDS.length-1,spd+1);playing=true;renderClock()};$('#now').onclick=()=>{simMs=Date.now();spd=3;playing=true;renderClock()};

/* ---------- picking & edge zoom ---------- */
const cvs=renderer.domElement;let downXY=null;
function pickAt(x,y){let best=null,bd=1e9;for(const o of OBJ){if(o.level!==cur||!filt[o.cat]||!o.node&&o.cat!=='region')continue;tmp.copy(o.pos).project(camera);if(tmp.z>1)continue;const sx=(tmp.x+1)/2*innerWidth,sy=(1-tmp.y)/2*innerHeight,d=Math.hypot(sx-x,sy-y),pr=(o.vis||.5)/camera.position.distanceTo(o.pos)*PU.uScale.value*.5,lim=Math.max(16,pr);if(d<lim&&d-pr<bd){bd=d-pr;best=o}}return best}
cvs.addEventListener('pointerdown',e=>{downXY=[e.clientX,e.clientY]});
cvs.addEventListener('pointerup',e=>{if(downXY&&Math.hypot(e.clientX-downXY[0],e.clientY-downXY[1])<6){const o=pickAt(e.clientX,e.clientY);if(o){endTour();select(o)}}downXY=null});
let hovT=0;cvs.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||performance.now()-hovT<60)return;hovT=performance.now();hov=pickAt(e.clientX,e.clientY);cvs.style.cursor=hov?'pointer':'grab'});
controls.addEventListener('start',()=>{if(anim){anim=null;controls.enabled=true}});
cvs.addEventListener('wheel',e=>{if(busy)return;const d=controls.getDistance(),now=performance.now();if(now-pushT>700)push=0;pushT=now;
 if(e.deltaY>0&&d>=controls.maxDistance*.97&&cur<LV.length-1){push+=Math.min(120,e.deltaY);if(push>360){push=0;side.classList.remove('on');sel=null;goLevel(cur+1,'up')}}
 else if(e.deltaY<0&&cur>0&&d<=controls.minDistance*1.25&&controls.target.length()<LV[cur].home){push+=Math.min(120,-e.deltaY);if(push>360){push=0;side.classList.remove('on');sel=null;goLevel(cur-1,'down')}}},{passive:true});
function edgeHint(){const d=controls.getDistance(),e=$('#edge');if(tour||busy||anim){e.classList.remove('on');return}
 if(d>=controls.maxDistance*.9&&cur<LV.length-1){$('#edgeT').textContent=`Keep zooming out to leave the ${LV[cur].name}`;$('#edgeB').textContent=`Go to ${LV[cur+1].name}`;$('#edgeB').onclick=()=>{side.classList.remove('on');sel=null;goLevel(cur+1,'up')};e.classList.add('on')}
 else if(cur>0&&d<=controls.minDistance*1.6&&controls.target.length()<LV[cur].home){$('#edgeT').textContent='Keep zooming in to go closer';$('#edgeB').textContent=`Enter ${LV[cur-1].name}`;$('#edgeB').onclick=()=>{side.classList.remove('on');sel=null;goLevel(cur-1,'down')};e.classList.add('on')}
 else e.classList.remove('on')}

/* ---------- resize & loop ---------- */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();PU.uScale.value=h/(2*Math.tan(camera.fov*D2R/2))}
addEventListener('resize',resize);resize();
let last=performance.now(),fr=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.1,(now-last)/1000);last=now;
 if(playing)simMs+=dt*1000*SPEEDS[spd][0];
 if(cur===0){updateSolar(simMs/864e5+2440587.5);sg1.material.opacity=.9;}
 stepAnim(now);
 if(follow&&!anim){const d=follow.pos.clone().sub(lastF);camera.position.add(d);controls.target.add(d);lastF.copy(follow.pos)}
 controls.update();renderer.render(scene,camera);updateLabels();
 if(++fr%12===0){if(cur===0)renderClock();if(sel&&side.classList.contains('on')&&sel.level===0){const pd=$('#pdist');if(pd)pd.innerHTML=distHTML(sel)}edgeHint()}}

/* ---------- start ---------- */
renderLadder();renderClock();applyFilters();
LV[0].group.visible=true;controls.maxDistance=LV[0].max;controls.minDistance=LV[0].min;
updateSolar(simMs/864e5+2440587.5);
const h0=decodeURIComponent(location.hash.slice(1));
const startObj=byId[h0]||EARTH;
camera.position.copy(LV[0].dir.clone().normalize().multiplyScalar(LV[0].start));controls.target.set(0,0,0);
requestAnimationFrame(loop);
setTimeout(()=>{$('#load').classList.add('done');select(startObj)},250);
addEventListener('hashchange',()=>{const o=byId[decodeURIComponent(location.hash.slice(1))];if(o&&o!==sel)select(o)});
})();
</script>
